name: frame-host-recovery-probe

# Explicit, zero-provider validation of the real D-repo recovery credential.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src/core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install httpx==0.28.1
      - name: Verify Pages rebuild using the production frame credential
        env:
          FRAME_HOST_TOKEN: ${{ secrets.FRAME_HOST_TOKEN }}
        run: |
          python - <<'PY'
          import asyncio, os
          from src.core.image_host import GithubPagesHost
          async def main():
              token = os.environ.get('FRAME_HOST_TOKEN', '').strip()
              if not token:
                  raise RuntimeError('FRAME_HOST_TOKEN is not configured')
              host = GithubPagesHost('Q-1844', 'agnes-frame-host', 'main', token)
              base = 'https://api.github.com/repos/Q-1844/agnes-frame-host/pages'
              async with host._client() as client:
                  settings = await client.get(base, headers=host._headers())
                  settings.raise_for_status()
                  data = settings.json()
                  if data.get('build_type') != 'legacy' or (data.get('source') or {}).get('branch') != 'main':
                      raise RuntimeError('Unexpected Pages branch/build type; no rebuild requested')
                  latest = await client.get(base + '/builds/latest', headers=host._headers())
                  latest.raise_for_status()
                  if latest.json().get('status') in ('building', 'queued'):
                      raise RuntimeError('Deployment already active; retry probe after it settles')
                  response = await client.post(base + '/builds', json={}, headers=host._headers())
                  if response.status_code != 201:
                      raise RuntimeError(f'Production frame credential cannot request Pages rebuild: HTTP {response.status_code}')
              print('Production FRAME_HOST_TOKEN requested D-repo rebuild: HTTP 201. Zero Agnes calls.')
          asyncio.run(main())
          PY
