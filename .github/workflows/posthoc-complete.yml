name: posthoc-complete

# 对「仅在归档回读自证步骤失败」的 run 做事后补完（验证→Registry→B1 COMPLETE）。
# 适用场景：finalize 传播竞态类失败（如 daycarry20m-20261102 的 404 早到 ~0.7s），
# 资产实际完好时零生成、零派发地补完账面。配套修复：fix/archive-readback-404-grace。
# 反递归 checklist（PR#49 教训）：本 workflow 不用 GITHUB_TOKEN 派发任何后续 run，
# 全部写操作走 B1_ARCHIVE_TOKEN，无 workflow_run 事件依赖。

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: '要补完的项目 nonce（如 daycarry20m-20261102）'
        required: true
        type: string
      expected_package_sha256:
        description: '可选：project.tar 期望 sha256（空=只对 GitHub 服务端 digest）'
        required: false
        default: ''
        type: string
      expected_media_sha256:
        description: '可选：final.mp4 期望 sha256'
        required: false
        default: ''
        type: string
      dry_run:
        description: '只验证不写入'
        required: false
        default: false
        type: boolean
      evidence_artifact_run_id:
        description: '🔴 starter 僵尸场景：e2e-evidence artifact 所在生产 run 的 ID（下载解包供重打包）'
        required: false
        default: ''
        type: string
      source_code_commit:
        description: '重打包 plan 的源码提交（生产 run 的 source SHA）'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [posthoc-archive-complete]

permissions:
  contents: read
  actions: read

jobs:
  posthoc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps
        # ubuntu-latest 镜像已无 ffmpeg；apt 镜像实测可卡 20+ 分钟无超时。
        # 改用 BtbN 静态构建直取 ffprobe（GitHub CDN，~80MB）。
        run: |
          pip install httpx
          curl -sL --max-time 300 https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ --strip-components=2 -C /usr/local/bin ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          ffprobe -version | head -1
      - name: Fetch e2e-evidence artifact (starter-zombie rebuild)
        # 🔴 ink-diffusion-20261107：project.tar POST 201 假回执后 finalize 永久
        # 卡 starter，资产不可下载。从生产 run 的 e2e-evidence artifact 恢复
        # 项目目录供重打包（project-rebuilt-{sha12}.tar 替代资产）。
        if: ${{ inputs.evidence_artifact_run_id != '' || github.event.client_payload.evidence_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: e2e-evidence
          run-id: ${{ inputs.evidence_artifact_run_id || github.event.client_payload.evidence_artifact_run_id }}
          path: evidence-artifact
      - name: Post-hoc archive completion
        env:
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          INPUT_NONCE: ${{ inputs.nonce || github.event.client_payload.nonce }}
          INPUT_PKG_SHA: ${{ inputs.expected_package_sha256 || github.event.client_payload.expected_package_sha256 }}
          INPUT_MEDIA_SHA: ${{ inputs.expected_media_sha256 || github.event.client_payload.expected_media_sha256 }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run }}
          INPUT_ARTIFACT_RUN_ID: ${{ inputs.evidence_artifact_run_id || github.event.client_payload.evidence_artifact_run_id }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_code_commit || github.event.client_payload.source_code_commit }}
        run: |
          set -euo pipefail
          args=(--nonce "$INPUT_NONCE")
          if [ -n "$INPUT_PKG_SHA" ]; then args+=(--expected-package-sha256 "$INPUT_PKG_SHA"); fi
          if [ -n "$INPUT_MEDIA_SHA" ]; then args+=(--expected-media-sha256 "$INPUT_MEDIA_SHA"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$INPUT_ARTIFACT_RUN_ID" ]; then
            args+=(--rebuild-from "evidence-artifact/projects/cloud3min_${INPUT_NONCE}")
            if [ -n "$INPUT_SOURCE_COMMIT" ]; then args+=(--source-code-commit "$INPUT_SOURCE_COMMIT"); fi
          fi
          python tools/posthoc_complete.py "${args[@]}"
