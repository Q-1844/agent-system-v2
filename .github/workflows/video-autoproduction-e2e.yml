name: video-autoproduction-e2e

# Real acceptance is explicit dispatch. The existing single-clip queue has its
# own patrol; it must not be confused with this full-project >=180s test.
on:
  workflow_dispatch:
    inputs:
      acceptance_scope:
        description: '真实验收范围（长片至少180秒）'
        type: choice
        options:
          - full-project-3min
          - existing-single-clip
        default: full-project-3min
      resume_run_id:
        description: '恢复已失败运行的 Actions run ID（复用原 nonce、项目与已完成视频）'
        required: false
        default: ''
      finalize_only:
        description: '仅对账已完成素材并合成归档，禁止 Agnes 新生成'
        type: boolean
        default: false
      driver_timeout_minutes:
        description: '制作保险丝分钟数（30–330；为360分钟job保留至少30分钟）'
        type: number
        default: 330
      archive_release_id:
        description: '仅归档接续时复用已有B Release ID（保留旧资产）'
        type: string
        default: ''
      task_nonce:
        description: '合成任务 nonce（留空=自动时间戳）'
        required: false
        default: ''

permissions:
  actions: read   # read the exact failed run artifact for explicit recovery
  contents: read   # 仅 checkout；B1 跨仓写用 B1_ARCHIVE_TOKEN secret，不用 GITHUB_TOKEN

concurrency:
  group: video-production
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            src
            config
            routers
            services
            saved_characters
            saved_scenes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Inspect existing task before media setup
        if: inputs.acceptance_scope == 'existing-single-clip'
        id: work
        env:
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          TASK_NONCE: ${{ inputs.task_nonce }}
          PYTHONPATH: .
        run: python tools/video_runtime_preflight.py e2e

      - name: Install ffmpeg
        if: inputs.acceptance_scope != 'existing-single-clip' || steps.work.outputs.needs_media == 'true'
        timeout-minutes: 7
        run: bash tools/install_ci_ffmpeg.sh

      - name: Verify ffmpeg/ffprobe on PATH
        if: inputs.acceptance_scope != 'existing-single-clip' || steps.work.outputs.needs_media == 'true'
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run autonomous E2E (real Agnes gen → MP4 → ffprobe → save B1 → registry)
        if: inputs.acceptance_scope == 'existing-single-clip'
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          PYTHONPATH: .
          TASK_NONCE: ${{ inputs.task_nonce }}
        run: python tools/e2e_autonomous_run.py

      - name: Real FullProject → Director/Planner → SceneRuns → >=180s final film → restore verification
        if: inputs.acceptance_scope != 'existing-single-clip'
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          FRAME_HOST_TOKEN: ${{ secrets.FRAME_HOST_TOKEN }}
          PYTHONPATH: .
          TASK_NONCE: ${{ inputs.task_nonce }}
          AGNES_VIDEO_INFLIGHT: '1'
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
          DRIVER_TIMEOUT_MINUTES: ${{ inputs.driver_timeout_minutes }}
          WORKFLOW_TIMEOUT_MINUTES: '360'
          ARCHIVE_RELEASE_ID: ${{ inputs.archive_release_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/full_project_cloud_acceptance.py

      - name: Upload E2E evidence (MP4 + summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e_run/
            projects/cloud3min_*/
            cache/jobs.json
            cache/quota.json
          retention-days: 7
          if-no-files-found: warn
