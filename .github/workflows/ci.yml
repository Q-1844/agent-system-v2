name: mock-regression

on:
  push:
    branches: [main, chore/migration-readiness, 'collab/**']
  pull_request:
    branches: [main, chore/migration-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            src
            tests
            config
            routers
            services
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-ci.txt
      - name: Fetch P55 relstore sample from B archive
        env:
          P55_TAR_URL: https://api.github.com/repos/Q-1844/agent-system-v2-rundata/contents/films/P55_SMOKE2B.tar
          P55_TAR_SHA256: f18a80b3a2b60b4ed762ef9aec70edb85f9124147dd8cdc1f7f38779dd2b75ff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p55"
          curl -fsSL -o "$RUNNER_TEMP/p55/P55_SMOKE2B.tar" \
            -H "Accept: application/vnd.github.raw" "$P55_TAR_URL"
          echo "$P55_TAR_SHA256  $RUNNER_TEMP/p55/P55_SMOKE2B.tar" | sha256sum -c -
          echo "P55_TAR_PATH=$RUNNER_TEMP/p55/P55_SMOKE2B.tar" >> "$GITHUB_ENV"
      - name: Offline storage and production recovery regression
        run: python -m pytest tests/relstore/ -q --junitxml=results/runtime.xml
      - name: Validate Linux media bootstrap and H264 encode/decode
        timeout-minutes: 7
        env:
          FFMPEG_BOOTSTRAP_FORCE: '1'
        run: |
          bash tools/install_ci_ffmpeg.sh
          # GITHUB_PATH becomes visible in the following step.
      - name: Exercise installed ffmpeg and ffprobe
        run: |
          ffmpeg -v error -f lavfi -i color=c=blue:s=128x72:r=24 -t 1 \
            -an -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/media-smoke.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,duration \
            -of json "$RUNNER_TEMP/media-smoke.mp4"
          ffmpeg -v error -xerror -i "$RUNNER_TEMP/media-smoke.mp4" -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-results
          path: results/runtime.xml
          retention-days: 7

  mock-regression:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            .github/workflows/video-autoproduction-e2e.yml
            src
            tests
            config
            routers
            services
            scripts
            input
            saved_characters
            saved_scenes
            docs
            tasks

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Ensure ffmpeg and ffprobe for media fixtures
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffprobe -version

      - name: Fetch P55 relstore sample from B archive
        shell: pwsh
        env:
          P55_TAR_URL: https://api.github.com/repos/Q-1844/agent-system-v2-rundata/contents/films/P55_SMOKE2B.tar
          P55_TAR_SHA256: f18a80b3a2b60b4ed762ef9aec70edb85f9124147dd8cdc1f7f38779dd2b75ff
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'p55'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tar = Join-Path $dir 'P55_SMOKE2B.tar'
          curl.exe -fsSL -o $tar -H 'Accept: application/vnd.github.raw' $env:P55_TAR_URL
          if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE" }
          $h = (Get-FileHash $tar -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:P55_TAR_SHA256) { throw "P55 tar sha mismatch: got $h" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "P55_TAR_PATH=$tar`n")

      - name: Run full mock regression (zero external API)
        run: python -m pytest tests/ -q --junitxml=results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: results/junit.xml
          retention-days: 3

  pipeline-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            src
            tests
            config
            routers
            services
            scripts
            input
            saved_characters
            saved_scenes
            docs
            tasks

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run animation pipeline smoke (AgentRuntime full chain, mock, zero external API)
        run: python -m pytest tests/test_ai_6f_real_pipeline.py -q --junitxml=results/smoke_junit.xml

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/smoke_junit.xml
          retention-days: 3
