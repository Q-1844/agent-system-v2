name: mock-regression

on:
  push:
    branches: [main, chore/migration-readiness, 'collab/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-regression:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run full mock regression (zero external API)
        run: python -m pytest tests/ -q --junitxml=results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: results/junit.xml
          retention-days: 3

  pipeline-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Run animation pipeline smoke (AgentRuntime full chain, mock, zero external API)
        run: python -m pytest tests/test_ai_6f_real_pipeline.py -q --junitxml=results/smoke_junit.xml

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/smoke_junit.xml
          retention-days: 3
