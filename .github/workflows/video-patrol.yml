name: video-patrol

# Existing single-clip queue; no A-repo git writes.
# GitHub cron is best-effort. The run event and task outcomes are evidence.
# Since 2026-10-24 this patrol also sweeps dead-link full films: checkpoints
# left in a resumable phase whose Actions run died get one bounded dispatch
# hop (patrol_dispatch, hop cap + AWAITING_HUMAN) — see tools/resume_patrol.py.
on:
  schedule:
    - cron: '7,27,47 * * * *'  # every 20 min, away from the start of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-production
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Keep the 1.39 GB historical media out of a production runner.
          sparse-checkout: |
            tools
            src
            tasks
            config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Inspect queue before media setup
        id: work
        env:
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          PYTHONPATH: .
        run: python tools/video_runtime_preflight.py patrol

      - name: Install ffmpeg
        if: steps.work.outputs.needs_media == 'true'
        timeout-minutes: 7
        run: bash tools/install_ci_ffmpeg.sh

      - name: Dead-link full-film sweep (bounded auto-resume, B)
        env:
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          RESUME_DISPATCH_TOKEN: ${{ secrets.RESUME_DISPATCH_TOKEN }}
          PYTHONPATH: .
        run: python tools/resume_patrol.py

      - name: Patrol scan + produce-if-pending
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          PYTHONPATH: .
        run: python tools/patrol_run.py

      - name: Upload patrol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-evidence-${{ github.run_id }}
          path: e2e_run/
          retention-days: 7
          if-no-files-found: warn
