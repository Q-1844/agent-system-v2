name: video-patrol

# Existing single-clip queue; no A-repo writes or self-trigger loop.
# GitHub cron is best-effort. The run event and task outcomes are evidence.
on:
  schedule:
    - cron: '7,27,47 * * * *'  # every 20 min, away from the start of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-production
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Keep the 1.39 GB historical media out of a production runner.
          sparse-checkout: |
            tools
            src
            tasks
            config

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Patrol scan + produce-if-pending
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          B1_ARCHIVE_TOKEN: ${{ secrets.B1_ARCHIVE_TOKEN }}
          PYTHONPATH: .
        run: python tools/patrol_run.py

      - name: Upload patrol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-evidence-${{ github.run_id }}
          path: e2e_run/
          retention-days: 7
          if-no-files-found: warn
