# 动画分镜工作流 - 全局配置

agnes:
  base_url: "https://apihub.agnes-ai.cn"   # 国内入口（2026-07-29 官方上线），国内直连无需代理；国际站 .com 在 Cloudflare 后会被 TLS reset
  api_key: ${AGNES_API_KEY}  # 从环境变量读取（.com 与 .cn 共用同一 Key）
  proxy: ""  # 国内入口直连，留空=不走代理。若改回国际站 .com 需配 Clash 代理 http://127.0.0.1:7890

  models:
    text: "agnes-2.0-flash"
    image: "agnes-image-2.1-flash"
    video: "agnes-video-v2.0"

  # 🔴 限流器分桶 RPM（AGNES_API_FACTS §4.1 免费用户实际 RPM）。一般不用改。
  # 视频就是 1，别调大——并发提交视频 = 全部 429。
  rpm:
    text: 20
    image_1k: 20
    image_2k: 10
    image_3k: 1
    image_4k: 1
    video: 1

  # 新档位制（AGNES_API_FACTS §2.3）：本项目一律用 1K 档
  image:
    size_tier: "1K"       # 16:9 -> 1312x736
    ratio: "16:9"
    timeout: 300

  video:
    frame_rate: 24
    polling_interval: 5   # 🔴 从 10 改为 5（官方建议）
    max_wait: 3600

  # 旧 settings 块保留：character_gen / storyboard_gen 仍读取
  # （阶段 5 清理时随旧管线一并移除）
  settings:
    image:
      size: "1152x768"
      response_format: "url"
      num_candidates: 3
      quality_threshold: 7.0
      max_retries: 5          # 最大重试次数
      timeout: 300            # 单次请求超时: 5分钟

    character_sheet:
      size: "1792x1024"       # 角色设定图：横版，三个视角并排
      num_candidates: 2       # 角色设定图候选数（减少API调用）
      quality_threshold: 7.0

    video:
      num_frames: 121
      frame_rate: 24
      polling_interval: 10    # 旧值，保留供旧管线读取；新代码用 agnes.video.polling_interval
      max_polling_retries: 360  # 最大轮询次数: 360次 × 10秒 = 60分钟

# ImageHost：把本地图片变成 Agnes 服务端能访问的公网 URL。
# 🔴 默认 imgbb（2026-07-31 实测唯一可用方案：Agnes .cn 服务端能下载 imgbb URL，i2v 成功）。
#    imgbb 上传原字节 100% 保真，URL 长期有效（吻合 project.json 持久化 + 崩溃恢复设计）。
#    按文件 sha1 哈希缓存（cache/imgbb_cache.json），同图重试只传一次。
# agnes_rehost：不保真（i2i 重采样改比例），仅参考图用，默认不启用，不在此配置。
# tunnel：URL 不稳定（重启换域名），降级调试用，不做默认。
# passthrough：不能上传本地图，仅复用 Agnes 原始 URL。
image_host:
  kind: "imgbb"
  imgbb:
    api_key: "${IMGBB_API_KEY}"
    expiration: 0          # 0=永不过期
  # r2:        # 未配置
  #   account_id / access_key / secret_key / bucket / public_base
  # tunnel:    # 未启用（降级调试）
  #   public_base / serve_root

# 每日配额账本（免费用户官方未公布确切数值，给保守默认值）
quota:
  video_seconds: 300
  images: 500
  text_calls: 2000

mimo:
  base_url: "https://token-plan-cn.xiaomimimo.com/v1/chat/completions"
  api_key: ${MIMO_API_KEY}

  models:
    tts: "mimo-v2.5-tts"

project:
  base_dir: "./projects"
  log_dir: "./logs"
